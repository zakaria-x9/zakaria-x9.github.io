name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AF5F83: ${{ secrets.AF5F83 }}
          BC72B2: ${{ secrets.BC72B2 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AF5F83', '')
          bm = os.environ.get('BC72B2', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- cab8e69447a60ae0 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 0e3aace27943822a706d7958234b876a2bdc207a -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
